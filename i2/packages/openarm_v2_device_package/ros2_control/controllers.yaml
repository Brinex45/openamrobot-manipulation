# Controller layout aligned with openarm_ros2 revision
# 4e837e1d0dae692ff67b560b69d8d281d7a8d4ed.
# This is a configuration snapshot, not proof of a running hardware stack.

controller_manager:
  ros__parameters:
    update_rate: 100
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    left_gripper_controller:
      type: position_controllers/GripperActionController
    right_gripper_controller:
      type: position_controllers/GripperActionController
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

left_arm_controller:
  ros__parameters:
    joints: [openarm_left_joint1, openarm_left_joint2, openarm_left_joint3, openarm_left_joint4, openarm_left_joint5, openarm_left_joint6, openarm_left_joint7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

right_arm_controller:
  ros__parameters:
    joints: [openarm_right_joint1, openarm_right_joint2, openarm_right_joint3, openarm_right_joint4, openarm_right_joint5, openarm_right_joint6, openarm_right_joint7]
    command_interfaces: [position]
    state_interfaces: [position, velocity]

left_gripper_controller:
  ros__parameters:
    joint: openarm_left_finger_joint1

right_gripper_controller:
  ros__parameters:
    joint: openarm_right_finger_joint1
